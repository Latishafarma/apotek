        const DEFAULT_SARANA_NAMA = "APOTEK LATISHA FARMA";

        const DEFAULT_APOTEKER_SIPA = "400.7.5.4/256/SIPA/IV.13/MSJ/2026";
        const DEFAULT_DOKTER_NAMA = "dr. Anis Prima Dewi";
        const WEB_APP_ABSEN_URL = 'https://script.google.com/macros/s/AKfycbzpG4kTChJ-Sd6-D4oP5ZWND3sQ6fQb0EidgJ-PKIIhPGlap0ENeFQd44j6_m1UftZt/exec';
        
        const QR_CONTENT_APOTEKER = `VALID TTD APOTEKER: ${DEFAULT_APOTEKER_NAMA} | SIPA: ${DEFAULT_APOTEKER_SIPA} | SIA: ${DEFAULT_SARANA_IZIN}`;
        const QR_CONTENT_BIDAN = `VALID TTD PENANGGUNGJAWAB: ${DEFAULT_DOKTER_NAMA} | DPM ANIS PRIMA DEWI`;

        function QRCodeComponent({ text, size = 96 }) {
            const qrRef = React.useRef(null);
            React.useEffect(() => {
                if (qrRef.current) {
                    qrRef.current.innerHTML = "";
                    new QRCode(qrRef.current, {
                        text: text || QR_CONTENT_APOTEKER,
                        width: size, height: size,
                        colorDark: "#000000", colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
            }, [text, size]);
            return <div ref={qrRef} className="inline-block p-1 bg-white border border-slate-300 rounded shadow-sm"></div>;
        }

        function KopSuratKlinis() {
            return (
                <div className="text-center border-b-2 border-slate-900 pb-3 mb-4 font-sans">
                    <h2 className="text-lg font-extrabold tracking-wide uppercase">{DEFAULT_SARANA_NAMA}</h2>
                    <p className="text-xs text-slate-700 mt-0.5">{DEFAULT_SARANA_ALAMAT}</p>
                </div>
            );
        }

        function getStorage(key, def) {
            try { const s = localStorage.getItem('apodok_' + key); if (s) return JSON.parse(s); } catch(e){}
            return def;
        }
        function setStorage(key, val) {
            try { localStorage.setItem('apodok_' + key, JSON.stringify(val)); } catch(e){}
        }

        function hitungUmur(tglLahir) {
            if (!tglLahir) return 0;
            const dob = new Date(tglLahir);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            return isNaN(age) || age < 0 ? 0 : age;
        }

        function Button({ children, onClick, variant = "primary", className = "", type = "button", icon }) {
            let base = "px-3 py-2 rounded-xl font-medium text-xs md:text-sm transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer ";
            let st = "bg-emerald-600 text-white hover:bg-emerald-700";
            if (variant === "secondary") st = "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50";
            else if (variant === "danger") st = "bg-rose-600 text-white hover:bg-rose-700";
            else if (variant === "warning") st = "bg-amber-500 text-white hover:bg-amber-600";
            else if (variant === "info") st = "bg-blue-600 text-white hover:bg-blue-700";
            else if (variant === "purple") st = "bg-purple-600 text-white hover:bg-purple-700";
            return <button type={type} onClick={onClick} className={`${base} ${st} ${className}`}>{icon && <i className={icon}></i>}{children}</button>;
        }

        function Card({ children, className = "" }) {
            return <div className={`bg-white rounded-2xl border border-slate-200 shadow-sm p-6 ${className}`}>{children}</div>;
        }

        function ModalForm({ title, isOpen, onClose, onSubmit, children }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden my-8">
                        <div className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                            <h3 className="font-bold text-base">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={onSubmit} className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                            {children}
                            <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                <Button type="button" variant="secondary" onClick={onClose}>Batal</Button>
                                <Button type="submit" variant="primary">Simpan Data</Button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function PrintModal({ isOpen, onClose, title, children }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl overflow-hidden my-8">
                        <div className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center no-print">

                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                            {children}
                        </div>

        }

        function DashboardChart({ kunjungankbData, konselingData }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4', 'Minggu Ini'],
                            datasets: [
                                {
                                    label: 'Kunjungan KB',
                                    data: [2, 4, 3, 5, kunjungankbData.length],
                                    borderColor: '#2563eb',
                                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                    tension: 0.3,
                                    fill: true
                                },
                                {
                                    label: 'Farmasi Klinis',
                                    data: [1, 3, 2, 4, konselingData.length],
                                    borderColor: '#16a34a',
                                    backgroundColor: 'rgba(22, 163, 74, 0.1)',
                                    tension: 0.3,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top' }
                            },
                            scales: {
                                y: { beginAtZero: true, ticks: { precision: 0 } }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [kunjungankbData, konselingData]);

            return (
                <div className="h-72 w-full relative">
                    <canvas ref={chartRef}></canvas>
                </div>

                addAuditLog('Live Antrean', `Voice caller memanggil nomor ${currentPatient.nomor} (${currentPatient.name})`);

                                            <td className="px-4 py-3 font-bold text-slate-800">{p.name}<br/><span className="text-[10px] text-slate-500">{p.gender}, {p.age} thn</span></td>
                                            <td className="px-4 py-3"><span className="px-2.5 py-1 bg-slate-100 rounded text-[10px] font-bold">{p.category}</span></td>
                                            <td className="px-4 py-3">{p.phone}<br/><span className="text-[10px] text-slate-500">{p.address}</span></td>
                                            <td className="px-4 py-3">
                                                <span className={`px-2.5 py-1 rounded text-[10px] font-black ${p.allergy !== 'Tidak Ada' ? 'bg-rose-500 text-white shadow-xs animate-pulse' : 'bg-emerald-100 text-emerald-800'}`}>
                                                    {p.allergy}
                                                </span>
                                            </td>
                                            <td className="px-4 py-3 text-center">
                                                <button onClick={() => setSelectedCardPatient(p)} className="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-[10px] font-bold hover:bg-slate-800 transition">
                                                    <i className="fa-solid fa-qrcode mr-1"></i> Kartu QR
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden border border-slate-200">
                                <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm">{editPatientId ? 'Edit Data Pasien' : 'Registrasi Data Pasien Baru'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">NIK Pasien (16 Digit KTP)</label>
                                        <input type="text" required placeholder="1601..." className="w-full px-3 py-2 border rounded-xl" value={form.nik} onChange={e=>setForm({...form, nik: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Nama Lengkap Pasien</label>
                                        <input type="text" required placeholder="Nama KTP..." className="w-full px-3 py-2 border rounded-xl font-bold" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Tanggal Lahir</label>
                                            <input type="date" required className="w-full px-3 py-2 border rounded-xl" value={form.birthDate} onChange={e=>setForm({...form, birthDate: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">No. HP / WhatsApp</label>
                                            <input type="text" placeholder="08..." className="w-full px-3 py-2 border rounded-xl" value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Alamat Domisili</label>
                                        <input type="text" placeholder="Alamat..." className="w-full px-3 py-2 border rounded-xl" value={form.address} onChange={e=>setForm({...form, address: e.target.value})} />
                                    </div>
                                    <div className="p-3 bg-rose-50 border border-rose-200 rounded-2xl space-y-1">
                                        <label className="block font-black text-rose-800"><i className="fa-solid fa-shield-virus mr-1"></i> Flag Alergi Obat Spesifik</label>
                                        <input type="text" placeholder="Contoh: Amoxicillin, Paracetamol" className="w-full px-3 py-1.5 border border-rose-300 rounded-xl text-rose-900 font-bold bg-white" value={form.allergy} onChange={e=>setForm({...form, allergy: e.target.value})} />
                                    </div>
                                    <div className="pt-3 flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-slate-200 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-sky-600 text-white rounded-xl font-bold">Simpan Pasien</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {selectedCardPatient && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden p-6 text-center space-y-4 border border-slate-300" id="printable-modal">
                                <div className="border-b pb-3">
                                    <h2 className="font-black text-slate-900 text-sm">KLINIK LATISHA FARMA</h2>
                                    <p className="text-[10px] text-slate-600">KARTU REKAM MEDIS BEROBAT PASIEN</p>
                                </div>
                                <div className="border-2 border-slate-800 p-4 rounded-2xl space-y-2 text-left bg-white text-slate-900">
                                    <span className="text-[9px] text-slate-700 font-bold uppercase tracking-widest">NO. REKAM MEDIS</span>
                                    <h1 className="text-2xl font-black font-mono tracking-wider">{selectedCardPatient.id}</h1>
                                    <p className="text-sm font-bold">{selectedCardPatient.name}</p>
                                    <p className="text-[10px] text-slate-600">NIK: {selectedCardPatient.nik}</p>
                                </div>
                                <div className="w-32 h-32 mx-auto bg-white border-2 border-slate-300 rounded-2xl flex items-center justify-center p-2 shadow-xs">
                                    <img 
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=RM-${selectedCardPatient.id}-${selectedCardPatient.name}`} 
                                        alt="QR Code Pasien" 
                                        className="w-full h-full object-contain"
                                    />
                                </div>
                                <div className="flex gap-2 no-print">
                                    <button onClick={() => window.print()} className="flex-1 py-2 bg-sky-600 text-white font-bold rounded-xl text-xs">Cetak Kartu</button>
                                    <button onClick={() => setSelectedCardPatient(null)} className="px-4 py-2 bg-slate-200 font-bold rounded-xl text-xs text-slate-800">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUB-KOMPONEN 3: CHECK-IN & VITAL SIGN SCREENING ---
        function CheckinView({ patients, patientQueue, setPatientQueue, addAuditLog, setActiveTab }) {
            const [selectedId, setSelectedId] = useState('');
            const [patientSearch, setPatientSearch] = useState('');
            const [showPatientDropdown, setShowPatientDropdown] = useState(false);
            
            const [td, setTd] = useState('');
            const [suhu, setSuhu] = useState('');
            const [nadi, setNadi] = useState('');
            const [spo2, setSpo2] = useState('');

            const filteredPatients = useMemo(() => {
                if (!patientSearch) return patients;
                const lower = patientSearch.toLowerCase();
                return patients.filter(p => p.name.toLowerCase().includes(lower) || p.id.toLowerCase().includes(lower) || p.nik.toLowerCase().includes(lower));
            }, [patients, patientSearch]);

            const selectedPatient = patients.find(p => p.id === selectedId);

            const handleCheckin = () => {
                if (!selectedPatient) {
                    alert("Silakan pilih pasien terlebih dahulu dari daftar!");
                    return;
                }
                const newQueueItem = {
                    nomor: `A-00${patientQueue.length + 1}`,
                    rmId: selectedPatient.id,
                    name: selectedPatient.name,
                    age: selectedPatient.age || 35,
                    vital: `TD: ${td || '120/80'} | S: ${suhu || '36.5'}°C | Nadi: ${nadi || '80'} | SpO2: ${spo2 || '98'}%`,
                    status: 'Menunggu',
                    doctorId: 'DOC-001',
                    allergy: selectedPatient.allergy,
                    checkinTime: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                };
                setPatientQueue([...patientQueue, newQueueItem]);
                addAuditLog('Checkin Kunjungan', `Check-in pasien ${selectedPatient.name} (Antrean ${newQueueItem.nomor})`);
                alert(`Pasien ${selectedPatient.name} Berhasil Check-in dengan Nomor Antrean ${newQueueItem.nomor}`);
                setActiveTab('fo-antrean');
            };

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
                    <div className="border-b pb-4">
                        <h3 className="font-black text-slate-800 text-sm flex items-center gap-2">
                            <i className="fa-solid fa-stethoscope text-sky-600 text-base"></i> Check-in Kunjungan & Skrining Tanda Vital Pasien
                        </h3>
                        <p className="text-xs text-slate-500">Skrining awal perawat sebelum pasien masuk ke ruang periksa dokter.</p>
                    </div>

                    <div className="grid grid-cols-3 gap-6">
                        <div className="space-y-3 relative">
                            <label className="block font-bold text-xs text-slate-700">Pilih Pasien Terdaftar (Pencarian Otomatis)</label>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Ketik nama atau No. RM pasien..." 
                                    value={patientSearch}
                                    onChange={e => {
                                        setPatientSearch(e.target.value);
                                        setShowPatientDropdown(true);
                                    }}
                                    onFocus={() => setShowPatientDropdown(true)}
                                    className="w-full px-3 py-2.5 border rounded-xl text-xs bg-slate-50 font-bold text-slate-800"
                                />
                                {showPatientDropdown && filteredPatients.length > 0 && (
                                    <div className="absolute z-20 left-0 right-0 mt-1 bg-white border rounded-xl shadow-xl max-h-48 overflow-y-auto">
                                        {filteredPatients.map(p => (
                                            <div 
                                                key={p.id} 
                                                onClick={() => {
                                                    setSelectedId(p.id);
                                                    setPatientSearch(`${p.id} - ${p.name}`);
                                                    setShowPatientDropdown(false);
                                                }} 
                                                className="p-2.5 hover:bg-sky-50 cursor-pointer font-bold border-b text-xs text-slate-800"
                                            >
                                                {p.id} - {p.name} <span className="text-[10px] text-slate-400 font-normal">({p.nik})</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {selectedPatient && selectedPatient.allergy !== 'Tidak Ada' && (
                                <div className="p-4 bg-rose-500 text-white rounded-2xl text-xs font-bold shadow-md animate-pulse">
                                    <i className="fa-solid fa-triangle-exclamation mr-1.5"></i> PERINGATAN ALERGI: {selectedPatient.allergy}
                                </div>
                            )}
                        </div>

                        <div className="col-span-2 grid grid-cols-2 gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 text-xs">
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">Tekanan Darah (mmHg)</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: 120/80" 
                                    value={td} 
                                    onChange={e=>setTd(e.target.value)} 
                                    className="w-full px-3 py-2 border rounded-xl bg-white font-mono font-bold" 
                                />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">Suhu Tubuh (°C)</label>
                                <input 
                                    type="number" 
                                    step="0.1" 
                                    placeholder="Contoh: 36.5" 
                                    value={suhu} 
                                    onChange={e=>setSuhu(e.target.value)} 
                                    className="w-full px-3 py-2 border rounded-xl bg-white font-mono font-bold" 
                                />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">Denyut Nadi (bpm)</label>
                                <input 
                                    type="number" 
                                    placeholder="Contoh: 80" 
                                    value={nadi} 
                                    onChange={e=>setNadi(e.target.value)} 
                                    className="w-full px-3 py-2 border rounded-xl bg-white font-mono font-bold" 
                                />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-1">Saturasi Oksigen SpO2 (%)</label>
                                <input 
                                    type="number" 
                                    placeholder="Contoh: 98" 
                                    value={spo2} 
                                    onChange={e=>setSpo2(e.target.value)} 
                                    className="w-full px-3 py-2 border rounded-xl bg-white font-mono font-bold" 
                                />
                            </div>
                            <div className="col-span-2 pt-2">
                                <button onClick={handleCheckin} className="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-black rounded-xl shadow-md transition uppercase tracking-wider">
                                    <i className="fa-solid fa-paper-plane mr-2"></i> Kirim ke Antrean Dokter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-KOMPONEN 4: RUANG PERIKSA DOKTER (SOAP & E-PRESCRIBING) ---
       function DoctorSOAPView({ patientQueue, setPatientQueue, medicines, doctors, ePrescriptions, setEPrescriptions, rmeRecords, setRmeRecords, patients, icd10Database = [], addAuditLog }) {
    const [selectedQueue, setSelectedQueue] = useState(patientQueue[0] || null);
    const [soapS, setSoapS] = useState('');
    const [soapO, setSoapO] = useState('');
    const [soapA, setSoapA] = useState('');
    const [icdCode, setIcdCode] = useState('J00');
    const [presItems, setPresItems] = useState([]);
    const [icdSearch, setIcdSearch] = useState('');

   const filteredICD = useMemo(() => {
        if (!icdSearch) return [];
        return icd10Database.filter(i => 
            i.code.toLowerCase().includes(icdSearch.toLowerCase()) || 
            i.name.toLowerCase().includes(icdSearch.toLowerCase())
        );
    }, [icdSearch, icd10Database]);

    const handleAddMedItem = () => {
        setPresItems([...presItems, { medicineId: '', name: '', qty: 1, dosage: '3x1 Tablet Sesudah Makan' }]);
    };

    const handleSubmitRme = () => {
        if (!selectedQueue) {
            alert("Silakan pilih pasien antrean terlebih dahulu!");
            return;
        }

                const currentDoctor = doctors[0]?.name || 'dr. Pratama, Sp.PD';
                const newPrescriptionId = `RX-${Math.floor(Math.random() * 8999) + 1000}`;
                const newRmeId = `RME-${Date.now().toString().slice(-6)}`;
                const currentDate = new Date().toISOString().split('T')[0];
                const currentTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                const matchedPatient = patients.find(p => p.id === selectedQueue.rmId) || {};

                const newPrescription = {
                    id: newPrescriptionId,
                    rmId: selectedQueue.rmId || 'RM-001',
                    patientName: selectedQueue.name,
                    doctorName: currentDoctor,
                    items: presItems,
                    status: 'Pending Skrining',
                    timestamp: currentTime
                };
                setEPrescriptions([...ePrescriptions, newPrescription]);

                const newRmeRecord = {
                    id: newRmeId,
                    date: currentDate,
                    time: currentTime,
                    rmId: selectedQueue.rmId || 'RM-001',
                    patientName: selectedQueue.name,
                    nik: matchedPatient.nik || '1601000000000',
                    age: selectedQueue.age || matchedPatient.age || 30,
                    doctorName: currentDoctor,
                    vitalSign: selectedQueue.vital || '-',
                    soapS: soapS || 'Tidak ada keluhan utama yang dicatat.',
                    soapO: soapO || 'Pemeriksaan fisik dalam batas normal.',
                    soapA: soapA || 'J00 - Acute nasopharyngitis [common cold]',
                    icdCode: icdCode || 'J00',
                    prescription: presItems
                };
                setRmeRecords([newRmeRecord, ...rmeRecords]);

                if (setPatientQueue) {
                    setPatientQueue(patientQueue.filter(p => p.nomor !== selectedQueue.nomor));
                }

                addAuditLog('RME Dokter', `Pemeriksaan & Simpan RME ${newRmeRecord.id} untuk pasien ${selectedQueue.name}`);
                alert(`Pemeriksaan RME & Resep (${newPrescriptionId}) Berhasil Disimpan!`);

                setSoapS('');
                setSoapO('');
                setSoapA('');
                setIcdCode('J00');
                setIcdSearch('');
                setPresItems([]);
                setSelectedQueue(null);
            };

            return (
                <div className="grid grid-cols-3 gap-4 h-[80vh]">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col">
                        <h3 className="font-black text-slate-800 text-xs mb-3 flex items-center justify-between border-b pb-2 uppercase tracking-wider">
                            <span>Pasien Antrean Dokter</span>
                        </h3>
                        <div className="space-y-2 flex-1 overflow-y-auto custom-scrollbar">
                            {patientQueue.length === 0 ? (
                                <p className="text-xs text-slate-400 italic text-center py-6">Tidak ada antrean pasien.</p>
                            ) : (
                                patientQueue.map(q => (
                                    <div 
                                        key={q.nomor} 
                                        onClick={() => setSelectedQueue(q)} 
                                        className={`p-3 border rounded-xl cursor-pointer transition ${selectedQueue?.nomor === q.nomor ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-400/20' : 'bg-slate-50 hover:bg-slate-100'}`}
                                    >
                                        <div className="flex justify-between items-center">
                                            <span className="font-mono font-black text-xs text-sky-700">{q.nomor}</span>
                                            <span className="text-[10px] text-slate-500 font-bold">{q.checkinTime}</span>
                                        </div>
                                        <h4 className="font-bold text-xs text-slate-800 mt-1">{q.name}</h4>
                                        <p className="text-[10px] text-slate-500 mt-0.5">{q.vital}</p>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col overflow-y-auto custom-scrollbar">
                        <div className="border-b pb-3 mb-4 flex justify-between items-center">
                            <div>
                                <h3 className="font-black text-slate-800 text-base">
                                    {selectedQueue ? `${selectedQueue.nomor} — ${selectedQueue.name}` : 'Pilih Pasien Dari Antrean'}
                                </h3>
                                {selectedQueue && (
                                    <p className="text-xs text-slate-500">Tanda Vital: <strong className="text-sky-600">{selectedQueue.vital}</strong></p>
                                )}
                            </div>
                        </div>

                        <div className="space-y-3 text-xs flex-1">
                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Subjective (Anamnesis & Keluhan Pasien)</label>
                                <textarea rows="2" placeholder="Contoh: Pasien mengeluh pusing dan demam sejak 2 hari..." value={soapS} onChange={e=>setSoapS(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white"></textarea>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Objective (Pemeriksaan Fisik & Penunjang)</label>
                                <textarea rows="2" placeholder="Contoh: Keadaan umum baik, pharynx hiperemis (+)..." value={soapO} onChange={e=>setSoapO(e.target.value)} className="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white"></textarea>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Assessment (Diagnosis & Kode ICD-10)</label>
                                <input type="text" placeholder="Ketik kode ICD-10 atau nama penyakit..." value={icdSearch} onChange={e=>{setIcdSearch(e.target.value); setSoapA(e.target.value);}} className="w-full px-3 py-2 border rounded-xl font-bold bg-white" />
                                {filteredICD.length > 0 && (
                                    <div className="bg-white border rounded-xl mt-1 max-h-32 overflow-y-auto shadow-lg p-1">
                                        {filteredICD.map(i => (
                                            <div key={i.code} onClick={() => { setSoapA(`${i.code} - ${i.name}`); setIcdCode(i.code); setIcdSearch(`${i.code} - ${i.name}`); }} className="p-1.5 hover:bg-sky-50 cursor-pointer rounded text-[11px]">
                                                <strong className="text-sky-600">{i.code}</strong> — {i.name}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="pt-3 border-t">
                                <div className="flex justify-between items-center mb-2">
                                    <h4 className="font-black text-xs text-sky-700"><i className="fa-solid fa-pills mr-1"></i> Resep Digital (E-Prescription)</h4>
                                    <button onClick={handleAddMedItem} className="px-3 py-1 bg-sky-50 text-sky-600 rounded-lg font-bold border text-xs hover:bg-sky-100">+ Tambah Item Obat</button>
                                </div>
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-100 text-slate-600 font-bold">
                                        <tr>
                                            <th className="p-2">Obat Master</th>
                                            <th className="p-2 w-20">QTY</th>
                                            <th className="p-2 w-48">Signa / Dosis</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {presItems.map((item, idx) => (
                                            <tr key={idx} className="border-b">
                                                <td className="p-2 relative">
                                                    <input 
                                                        type="text" 
                                                        value={item.name} 
                                                        placeholder="Ketik nama obat..."
                                                        onChange={e => {
                                                            const val = e.target.value;
                                                            const updated = [...presItems];
                                                            updated[idx].name = val;
                                                            setPresItems(updated);
                                                        }}
                                                        className="w-full border rounded-lg p-1.5 text-xs font-bold bg-white"
                                                    />
                                                    {item.name && !medicines.some(m => m.name.toLowerCase() === item.name.toLowerCase()) && (
                                                        <div className="absolute z-30 left-0 right-0 mt-1 bg-white border rounded-xl shadow-lg max-h-36 overflow-y-auto">
                                                            {medicines
                                                                .filter(m => m.name.toLowerCase().includes(item.name.toLowerCase()))
                                                                .map(m => (
                                                                    <div 
                                                                        key={m.id} 
                                                                        onClick={() => {
                                                                            const updated = [...presItems];
                                                                            updated[idx].medicineId = m.id;
                                                                            updated[idx].name = m.name;
                                                                            setPresItems(updated);
                                                                        }}
                                                                        className="p-2 hover:bg-sky-50 cursor-pointer font-bold border-b text-xs text-slate-800"
                                                                    >
                                                                        {m.name} <span className="text-[10px] text-slate-400 font-normal">({m.form} - {m.unit})</span>
                                                                    </div>
                                                                ))}
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-2">
                                                    <input type="number" min="1" value={item.qty} onChange={e=>{
                                                        const updated = [...presItems];
                                                        updated[idx].qty = Number(e.target.value);
                                                        setPresItems(updated);
                                                    }} className="w-full border rounded-lg p-1.5 text-xs font-bold text-center" />
                                                </td>
                                                <td className="p-2">
                                                    <input type="text" value={item.dosage} onChange={e=>{
                                                        const updated = [...presItems];
                                                        updated[idx].dosage = e.target.value;
                                                        setPresItems(updated);
                                                    }} className="w-full border rounded-lg p-1.5 text-xs" />
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="pt-4 border-t flex justify-end">
                            <button onClick={handleSubmitRme} className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs uppercase tracking-wider shadow-md transition">
                                <i className="fa-solid fa-paper-plane mr-1.5"></i> Simpan RME & Kirim Resep
                            </button>

                                                            value={printPaperSize} 
                                                            onChange={(e) => setPrintPaperSize(e.target.value)}

                                                        >
                                                            <option value="A5">Kertas A5</option>
                                                            <option value="A4">Kertas A4</option>
                                                            <option value="F4">Kertas F4 / Folio</option>
                                                            <option value="letter">Kertas Letter</option>
                                                        </select>
                                                    </div>

                                                        <Button variant="primary" icon="fa-solid fa-print" className="text-sm shadow-sm" onClick={() => window.print()}>
                                                            Cetak Dokumen
                                                        </Button>
                                                        <Button variant="secondary" icon="fa-solid fa-file-excel" className="text-sm" onClick={() => {
                                                            const dataToExport = (kunjungankb || []).map(item => {
                                                                const acc = (akseptor || []).find(a => a.nik === item.akseptorNik);
                                                                return {
                                                                    Tanggal: item.tanggal,
                                                                    "Nama Akseptor": acc ? acc.nama : item.akseptorNik,
                                                                    Petugas: item.petugasNama,

                                                                    Anamnesa: item.anamnesa,
                                                                    "Tanggal Kembali": item.tglKembali,
                                                                    Status: item.status

                                                            Excel

                                                            />

                                                        {filterPeriode === 'tahun' && (
                                                            <input 
                                                                type="number" 
                                                                placeholder="YYYY" 
                                                                value={filterTahun || ''}

                                                            type="text"

                                                            className="border px-3 py-1 rounded-lg text-xs bg-white w-60"

                                                </div>

                                                                    <th className="p-2.5 border">Tgl Kembali</th>
                                                                    <th className="p-2.5 border">Status</th>

                                                                {(() => {

                                                                        if (filterPeriode === 'tahun' && filterTahun) {
                                                                            if (!item.tanggal || !item.tanggal.startsWith(filterTahun)) return false;
                                                                        }

                                                                            const q = searchKunjungan.toLowerCase();
                                                                            const acc = (akseptor || []).find(a => a.nik === item.akseptorNik);
                                                                            const namaAcc = acc ? acc.nama.toLowerCase() : '';
                                                                            return (item.tanggal || '').includes(q) ||
                                                                                   namaAcc.includes(q) ||
                                                                                   (item.obatNama || '').toLowerCase().includes(q) ||
                                                                                   (item.petugasNama || '').toLowerCase().includes(q);
                                                                        }
                                                                        return true;
                                                                    }).sort((a, b) => {
                                                                        const dateA = new Date(a.tanggal);
                                                                        const dateB = new Date(b.tanggal);
                                                                        return sortKunjunganOrder === 'desc' ? dateB - dateA : dateA - dateB;

                                                                        return <tr><td colSpan="7" className="p-6 text-center text-slate-400">Tidak ada data kunjungan akseptor pada periode ini.</td></tr>;
                                                                    }

                                                                    return (
                                                                        <>
                                                                            {list.map(item => {
                                                                                const acc = (akseptor || []).find(a => a.nik === item.akseptorNik);

                                                                                    <tr key={item.id} className="border-b hover:bg-slate-50">

                                                        </table>

                                                        <div className="text-center w-64 space-y-16">

function ShiftFeeReportView({ rmeRecords = [] }) {
    const [selectedShift, setSelectedShift] = useState('SEMUA');
    const [selectedPetugas, setSelectedPetugas] = useState('');

    // Simulasi data shift petugas (bisa diintegrasikan dengan data login/absensi)
    const shiftData = [
        { id: 'RME-001001', date: '2026-10-28', shift: 'Pagi', doctor: 'dr. Pratama, Sp.PD', supportStaff: 'Bidan Rina', adminStaff: 'Andi (Admin)', patientName: 'Tn. Ahmad Dahlan' },
        { id: 'RME-001002', date: '2026-10-29', shift: 'Siang', doctor: 'dr. Pratama, Sp.PD', supportStaff: 'Perawat Siska', adminStaff: 'Dewi (Admin)', patientName: 'An. Bima Sakti' }
    ];

    const filteredShiftData = useMemo(() => {
        return shiftData.filter(item => {
            const matchShift = selectedShift === 'SEMUA' || item.shift === selectedShift;
            const matchPetugas = !selectedPetugas || 
                item.supportStaff.toLowerCase().includes(selectedPetugas.toLowerCase()) || 
                item.adminStaff.toLowerCase().includes(selectedPetugas.toLowerCase());
            return matchShift && matchPetugas;
        });
    }, [selectedShift, selectedPetugas]);

    // Hitung total fee otomatis berdasarkan jumlah pasien di shift tersebut
    const totalPasien = filteredShiftData.length;
    const totalFeeDokter = totalPasien * 20000;
    const totalFeeSupport = totalPasien * 5000;
    const totalFeeAdmin = totalPasien * 1000;

    return (
        <div className="space-y-4 text-xs">

                    <label className="block font-bold text-slate-700 mb-1">Pilih Shift Kerja</label>
                    <select value={selectedShift} onChange={e => setSelectedShift(e.target.value)} className="w-full p-2 border rounded-xl font-bold bg-slate-50">

                        <option value="Pagi">Shift Pagi</option>
                        <option value="Siang">Shift Siang</option>

                <div>

                </div>
                <div className="text-right pt-4">
                    <span className="text-slate-500 font-bold">Total Kunjungan Shift Ini: </span>
                    <span className="text-sky-600 font-black text-sm">{totalPasien} Pasien</span>
                </div>
            </div>

            {/* TABEL RINCIAN FEE */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b text-slate-600 font-bold uppercase">
                        <tr>
                            <th className="p-3">Tanggal & Shift</th>

                    <tbody className="divide-y">
                        {filteredShiftData.length === 0 ? (
                            <tr>
                                <td colSpan="5" className="p-6 text-center text-slate-400 italic">Tidak ada data fee pada shift ini.</td>

                            ))

            {/* RINGKASAN AKUMULASI FEE */}
            <div className="grid grid-cols-3 gap-4">
                <div className="bg-sky-50 border border-sky-200 p-4 rounded-2xl text-center">

function FeeSettingsView() {
    // State pengaturan fee sesuai ketentuan apotek
    const [feeConfig, setFeeConfig] = useState({
        doctorFee: 20000,
        medicalSupportFee: 5000,
        adminFee: 1000,
        activeOnlyForVisit: true // Hanya berlaku di pasien yang datang berobat
    });

    const [isSaved, setIsSaved] = useState(false);

    const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFeeConfig({
            ...feeConfig,
            [name]: type === 'checkbox' ? checked : Number(value)
        });
    };

    const handleSave = (e) => {
        e.preventDefault();
        // Di sini Anda bisa menambahkan fungsi simpan ke Supabase atau localStorage
        setIsSaved(true);
        setTimeout(() => setIsSaved(false), 3000);
    };

    return (
        <div className="space-y-4 text-xs max-w-4xl mx-auto">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center">

                <div className="grid grid-cols-3 gap-4">
