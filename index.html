            // Sinkronisasi data dari Supabase saat aplikasi dimuat
            useEffect(() => {
                const client = window.supabaseClient;
                if (!client) return;

                const fetchSupabaseData = async () => {
                    // Ambil Master ICD-10
                    const { data: icdData } = await client.from('master_icd10').select('*');
                    if (icdData && icdData.length > 0) {
                        setIcd10Database(icdData);
                    }

                    // Ambil Master Pasien jika tabel tersedia
                    const { data: patientData } = await client.from('patients').select('*');
                    if (patientData && patientData.length > 0) {
                        setPatients(patientData);
                    }
                };

                fetchSupabaseData();

                // Realtime subscription untuk ICD-10
                const subscription = client
                    .channel('public:master_icd10')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'master_icd10' }, (payload) => {
                        fetchSupabaseData();
                    })
                    .subscribe();

                return () => {
                    if (subscription) client.removeChannel(subscription);
                };
            }, []);

            const [rmeRecords, setRmeRecords] = useState([

                    id: 'RME-001001',
                    date: '2026-10-28',

            };

                                <button onClick={() => setIsLoggedIn(true)} className="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-black rounded-xl shadow-lg transition text-xs tracking-wider uppercase">

                                </button>

                    {/* SIDEBAR MEDIS */}

                                    <button onClick={() => setActiveTab('fo-pasien')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition ${activeTab === 'fo-pasien' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>

                                    </button>

                                        <i className="fa-solid fa-heart-pulse text-rose-400 w-4"></i> Check-in & Vital Sign
                                    </button>
                                </div>

                                <div className="pt-3">
                                    <p className="px-3 text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">2. RME & SOAP Dokter</p>
                                    <button onClick={() => setActiveTab('rme-pemeriksaan')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition ${activeTab === 'rme-pemeriksaan' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                        <i className="fa-solid fa-stethoscope text-sky-400 w-4"></i> Ruang Periksa Dokter
                                    </button>
                                    <button onClick={() => setActiveTab('rme-riwayat')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition ${activeTab === 'rme-riwayat' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>

                        <main className="flex-1 overflow-y-auto p-6 bg-slate-50 custom-scrollbar">

        // --- SUB-KOMPONEN 1: LIVE QUEUE MONITOR & VOICE CALLER ---
        function LiveQueueView({ patientQueue, setPatientQueue, addAuditLog }) {
            const currentPatient = patientQueue.find(p => p.status === 'Diperiksa') || patientQueue[0];

            const panggilVoice = () => {
                if (!currentPatient) return;
                const text = `Nomor antrean ${currentPatient.nomor}, atas nama ${currentPatient.name}, silakan masuk ke ruang periksa dokter.`;
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'id-ID';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert(text);
                }
                addAuditLog('Live Antrean', `Voice caller memanggil nomor ${currentPatient.nomor} (${currentPatient.name})`);
            };

            const antreanBerikutnya = () => {
                if (patientQueue.length === 0) return;
                const updated = patientQueue.map((p, idx) => idx === 0 ? { ...p, status: 'Selesai' } : p);
                setPatientQueue(updated.filter(p => p.status !== 'Selesai'));
            };

            return (
                <div className="grid grid-cols-3 gap-6 h-[78vh]">
                    <div className="col-span-2 bg-slate-900 text-white p-8 rounded-3xl shadow-xl flex flex-col justify-between border border-slate-800">
                        <div>
                            <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                                <span className="text-xs font-black text-sky-400 uppercase tracking-widest">Ruang Tunggu Pasien Klinik</span>
                                <span className="text-xs bg-emerald-500/20 text-emerald-400 px-3.5 py-1 rounded-full font-bold border border-emerald-500/30 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Dokter Praktek Standby
                                </span>
                            </div>
                            <div className="text-center py-12 space-y-3">
                                <span className="text-xs text-slate-400 font-bold uppercase tracking-widest">Nomor Antrean Dipanggil</span>
                                <h1 className="text-8xl font-black text-amber-400 tracking-wider font-mono">
                                    {currentPatient ? currentPatient.nomor : '-'}
                                </h1>
                                <p className="text-2xl font-bold text-white mt-2">{currentPatient ? currentPatient.name : 'Antrean Kosong'}</p>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={panggilVoice} className="flex-1 py-4 bg-sky-600 hover:bg-sky-700 text-white font-black rounded-2xl text-xs transition flex items-center justify-center gap-2 shadow-lg">
                                <i className="fa-solid fa-volume-high text-lg"></i> Panggil Pasien (Voice Speech Synthesis)
                            </button>
                            <button onClick={antreanBerikutnya} className="px-8 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl text-xs transition shadow-lg">
                                Antrean Selanjutnya <i className="fa-solid fa-forward ml-2"></i>
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
                        <div>
                            <h3 className="font-black text-slate-800 text-xs mb-3 flex items-center justify-between border-b pb-3 uppercase tracking-wider">
                                <span>Daftar Antrean Hari Ini</span>
                                <span className="text-[10px] bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-mono font-bold">Total: {patientQueue.length}</span>
                            </h3>
                            <div className="space-y-2.5 max-h-[60vh] overflow-y-auto custom-scrollbar">
                                {patientQueue.map(a => (
                                    <div key={a.nomor} className={`p-3.5 border rounded-xl flex justify-between items-center transition ${a.status === 'Diperiksa' ? 'bg-sky-50 border-sky-300 ring-2 ring-sky-400/20' : 'bg-white'}`}>
                                        <div>
                                            <span className="font-mono font-black text-xs text-sky-700 block">{a.nomor} — {a.name}</span>
                                            <span className="text-[11px] text-slate-500">{a.vital}</span>
                                        </div>
                                        <span className={`px-2.5 py-1 rounded text-[9px] font-black uppercase ${a.status === 'Diperiksa' ? 'bg-sky-600 text-white' : 'bg-amber-100 text-amber-800'}`}>
                                            {a.status}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

        // --- SUB-KOMPONEN 2: PATIENT MASTER & QR CARD GENERATOR ---

        // --- SUB-KOMPONEN 3: CHECK-IN & VITAL SIGN SCREENING ---
        function CheckinView({ patients, patientQueue, setPatientQueue, addAuditLog, setActiveTab }) {
            const [selectedId, setSelectedId] = useState('');
            const [patientSearch, setPatientSearch] = useState('');
            const [showPatientDropdown, setShowPatientDropdown] = useState(false);
            
            const [td, setTd] = useState('');
            const [suhu, setSuhu] = useState('');
            const [nadi, setNadi] = useState('');
            const [spo2, setSpo2] = useState('');

            const filteredPatients = useMemo(() => {
                if (!patientSearch) return patients;
                const lower = patientSearch.toLowerCase();
                return patients.filter(p => p.name.toLowerCase().includes(lower) || p.id.toLowerCase().includes(lower) || p.nik.toLowerCase().includes(lower));
            }, [patients, patientSearch]);

            const selectedPatient = patients.find(p => p.id === selectedId);

            const handleCheckin = () => {
                if (!selectedPatient) {
                    alert("Silakan pilih pasien terlebih dahulu dari daftar!");
                    return;
                }
                const newQueueItem = {
                    nomor: `A-00${patientQueue.length + 1}`,
                    rmId: selectedPatient.id,
                    name: selectedPatient.name,
                    age: selectedPatient.age || 35,
                    vital: `TD: ${td || '120/80'} | S: ${suhu || '36.5'}°C | Nadi: ${nadi || '80'} | SpO2: ${spo2 || '98'}%`,
                    status: 'Menunggu',
                    doctorId: 'DOC-001',
                    allergy: selectedPatient.allergy,
                    checkinTime: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                };
                setPatientQueue([...patientQueue, newQueueItem]);
                addAuditLog('Checkin Kunjungan', `Check-in pasien ${selectedPatient.name} (Antrean ${newQueueItem.nomor})`);
                alert(`Pasien ${selectedPatient.name} Berhasil Check-in dengan Nomor Antrean ${newQueueItem.nomor}`);
                setActiveTab('fo-antrean');
            };

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
                    <div className="border-b pb-4">
                        <h3 className="font-black text-slate-800 text-sm flex items-center gap-2">
                            <i className="fa-solid fa-stethoscope text-sky-600 text-base"></i> Check-in Kunjungan & Skrining Tanda Vital Pasien
                        </h3>
                        <p className="text-xs text-slate-500">Skrining awal perawat sebelum pasien masuk ke ruang periksa dokter.</p>

                    <div className="grid grid-cols-3 gap-6">

                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Ketik nama atau No. RM pasien..." 
                                    value={patientSearch}
                                    onChange={e => {
                                        setPatientSearch(e.target.value);
                                        setShowPatientDropdown(true);
                                    }}
                                    onFocus={() => setShowPatientDropdown(true)}
                                    className="w-full px-3 py-2.5 border rounded-xl text-xs bg-slate-50 font-bold text-slate-800"
                                />
                                {showPatientDropdown && filteredPatients.length > 0 && (
                                    <div className="absolute z-20 left-0 right-0 mt-1 bg-white border rounded-xl shadow-xl max-h-48 overflow-y-auto">
                                        {filteredPatients.map(p => (
                                            <div 
                                                key={p.id} 
                                                onClick={() => {
                                                    setSelectedId(p.id);
                                                    setPatientSearch(`${p.id} - ${p.name}`);
                                                    setShowPatientDropdown(false);
                                                }} 
                                                className="p-2.5 hover:bg-sky-50 cursor-pointer font-bold border-b text-xs text-slate-800"
                                            >
                                                {p.id} - {p.name} <span className="text-[10px] text-slate-400 font-normal">({p.nik})</span>
                                            </div>
                                        ))}
                                    </div>
                                )}

                            {selectedPatient && selectedPatient.allergy !== 'Tidak Ada' && (
                                <div className="p-4 bg-rose-500 text-white rounded-2xl text-xs font-bold shadow-md animate-pulse">
                                    <i className="fa-solid fa-triangle-exclamation mr-1.5"></i> PERINGATAN ALERGI: {selectedPatient.allergy}

                        <div className="col-span-2 grid grid-cols-2 gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 text-xs">

                                    type="text" 
                                    placeholder="Contoh: 120/80" 
                                    value={td} 
                                    onChange={e=>setTd(e.target.value)}

                                />
                            </div>

                                    type="number"

                                    placeholder="Contoh: 36.5"

                                    onChange={e=>setSuhu(e.target.value)}

        // --- SUB-KOMPONEN 4: RUANG PERIKSA DOKTER (SOAP & E-PRESCRIBING) ---
        function DoctorSOAPView({ patientQueue, setPatientQueue, medicines, doctors, ePrescriptions, setEPrescriptions, rmeRecords, setRmeRecords, patients, icd10Database = [], addAuditLog }) {
            const [selectedQueue, setSelectedQueue] = useState(patientQueue[0] || null);
            const [soapS, setSoapS] = useState('');
            const [soapO, setSoapO] = useState('');
            const [soapA, setSoapA] = useState('');
            const [icdCode, setIcdCode] = useState('J00');
            const [presItems, setPresItems] = useState([]);
            const [icdSearch, setIcdSearch] = useState('');

            const filteredICD = useMemo(() => {
                if (!icdSearch) return [];
                return icd10Database.filter(i => 
                    i.code.toLowerCase().includes(icdSearch.toLowerCase()) || 
                    i.name.toLowerCase().includes(icdSearch.toLowerCase())
                );
            }, [icdSearch, icd10Database]);

            const handleAddMedItem = () => {
                setPresItems([...presItems, { medicineId: '', name: '', qty: 1, dosage: '3x1 Tablet Sesudah Makan' }]);
            };

            const handleSubmitRme = async () => {
                if (!selectedQueue) {
                    alert("Silakan pilih pasien antrean terlebih dahulu!");
                    return;
                }

                const currentDoctor = doctors[0]?.name || 'dr. Pratama, Sp.PD';
                const newPrescriptionId = `RX-${Math.floor(Math.random() * 8999) + 1000}`;
                const newRmeId = `RME-${Date.now().toString().slice(-6)}`;
                const currentDate = new Date().toISOString().split('T')[0];
                const currentTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                const matchedPatient = patients.find(p => p.id === selectedQueue.rmId) || {};

                const newPrescription = {
                    id: newPrescriptionId,
                    rmId: selectedQueue.rmId || 'RM-001',
                    patientName: selectedQueue.name,
                    doctorName: currentDoctor,
                    items: presItems,
                    status: 'Pending Skrining',
                    timestamp: currentTime
                };
                setEPrescriptions([...ePrescriptions, newPrescription]);

                const newRmeRecord = {
                    id: newRmeId,
                    date: currentDate,
                    time: currentTime,
                    rmId: selectedQueue.rmId || 'RM-001',
                    patientName: selectedQueue.name,
                    nik: matchedPatient.nik || '1601000000000',
                    age: selectedQueue.age || matchedPatient.age || 30,
                    doctorName: currentDoctor,
                    vitalSign: selectedQueue.vital || '-',
                    soapS: soapS || 'Tidak ada keluhan utama yang dicatat.',
                    soapO: soapO || 'Pemeriksaan fisik dalam batas normal.',
                    soapA: soapA || 'J00 - Acute nasopharyngitis [common cold]',
                    icdCode: icdCode || 'J00',
                    prescription: presItems
                };

                if (window.supabaseClient) {
                    await window.supabaseClient.from('rme_records').insert([newRmeRecord]);
                }

                setRmeRecords([newRmeRecord, ...rmeRecords]);

                if (setPatientQueue) {
                    setPatientQueue(patientQueue.filter(p => p.nomor !== selectedQueue.nomor));
                }

                addAuditLog('RME Dokter', `Pemeriksaan & Simpan RME ${newRmeRecord.id} untuk pasien ${selectedQueue.name}`);
                alert(`Pemeriksaan RME & Resep (${newPrescriptionId}) Berhasil Disimpan & Disinkronisasi ke Supabase!`);

                setSoapS('');
                setSoapO('');
                setSoapA('');
                setIcdCode('J00');
                setIcdSearch('');
                setPresItems([]);
                setSelectedQueue(null);
            };

            return (
                <div className="grid grid-cols-3 gap-4 h-[80vh]">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col">
                        <h3 className="font-black text-slate-800 text-xs mb-3 flex items-center justify-between border-b pb-2 uppercase tracking-wider">
                            <span>Pasien Antrean Dokter</span>
                        </h3>
                        <div className="space-y-2 flex-1 overflow-y-auto custom-scrollbar">
                            {patientQueue.length === 0 ? (
                                <p className="text-xs text-slate-400 italic text-center py-6">Tidak ada antrean pasien.</p>
                            ) : (
                                patientQueue.map(q => (
                                    <div 
                                        key={q.nomor} 
                                        onClick={() => setSelectedQueue(q)} 
                                        className={`p-3 border rounded-xl cursor-pointer transition ${selectedQueue?.nomor === q.nomor ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-400/20' : 'bg-slate-50 hover:bg-slate-100'}`}
                                    >
                                        <div className="flex justify-between items-center">
                                            <span className="font-mono font-black text-xs text-sky-700">{q.nomor}</span>
                                            <span className="text-[10px] text-slate-500 font-bold">{q.checkinTime}</span>
                                        </div>
                                        <h4 className="font-bold text-xs text-slate-800 mt-1">{q.name}</h4>
                                        <p className="text-[10px] text-slate-500 mt-0.5">{q.vital}</p>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col overflow-y-auto custom-scrollbar">
                        <div className="border-b pb-3 mb-4 flex justify-between items-center">
                            <div>
                                <h3 className="font-black text-slate-800 text-base">
                                    {selectedQueue ? `${selectedQueue.nomor} — ${selectedQueue.name}` : 'Pilih Pasien Dari Antrean'}

                        {reportType === 'KASUS' && (

                                                </td>

                                            filteredKasus.map((item, idx) => (
                                                <tr key={item.id} className="border border-slate-400">

                                                    <td className="p-2 border border-slate-400 text-[10px]">
                                                        {item.prescription && item.prescription.map(p => `${p.name} (${p.qty})`).join(', ')}

                                </table>
                                <div className="text-right text-xs font-bold text-slate-700">
                                    Total Rekapitulasi Kasus: <span className="text-sky-600 font-black">{filteredKasus.length} Kasus</span>
                                </div>
                            </div>
                        )}

                        {reportType === 'ANAK' && (
                            <div className="space-y-3">
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 border border-slate-400 font-bold">
                                            <th className="p-2 border border-slate-400 text-center w-10">No</th>
                                            <th className="p-2 border border-slate-400 w-24">No. RM</th>
                                            <th className="p-2 border border-slate-400">Nama Pasien Anak</th>
                                            <th className="p-2 border border-slate-400 text-center w-20">Usia Anak</th>
                                            <th className="p-2 border border-slate-400">Pemeriksaan & Diagnosa</th>
                                            <th className="p-2 border border-slate-400">Instruksi Dosis Obat</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredAnak.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="p-6 text-center text-slate-400 italic border border-slate-400">
                                                    Tidak ditemukan data pasien anak (0-18 tahun) sesuai kriteria filter.
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredAnak.map((item, idx) => (
                                                <tr key={item.id} className="border border-slate-400">
                                                    <td className="p-2 border border-slate-400 text-center">{idx + 1}</td>
                                                    <td className="p-2 border border-slate-400 font-mono font-bold text-sky-700">{item.rmId}</td>
                                                    <td className="p-2 border border-slate-400 font-bold">{item.patientName}</td>
                                                    <td className="p-2 border border-slate-400 text-center font-black text-amber-700">{item.age} Tahun</td>
                                                    <td className="p-2 border border-slate-400">{item.soapA}</td>
                                                    <td className="p-2 border border-slate-400 text-[11px] italic">
                                                        {item.prescription && item.prescription.map(p => `${p.name} - ${p.dosage}`).join('; ')}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                                <div className="text-right text-xs font-bold text-slate-700">
                                    Total Pasien Anak Terlayani (0-18 Thn): <span className="text-amber-600 font-black">{filteredAnak.length} Anak</span>
                                </div>
                            </div>
                        )}

                        <div className="pt-8 grid grid-cols-2 text-xs text-slate-900 mt-6">
                            <div></div>
                            <div className="text-center space-y-12">
                                <p className="font-bold">Mesuji Raya, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}<br/>Dokter Pemeriksa</p>
                                <div className="pt-4">
                                    <p className="font-bold underline">dr. Pratama, Sp.PD</p>
                                    <p className="text-[10px] text-slate-600 mt-0.5">SIP: SIP/2024/001-KNA</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ShiftFeeReportView({ rmeRecords = [] }) {
            const [selectedShift, setSelectedShift] = useState('SEMUA');
            const [selectedPetugas, setSelectedPetugas] = useState('');

            const shiftData = [
                { id: 'RME-001001', date: '2026-10-28', shift: 'Pagi', doctor: 'dr. Pratama, Sp.PD', supportStaff: 'Bidan Rina', adminStaff: 'Andi (Admin)', patientName: 'Tn. Ahmad Dahlan' }
            ];

            const filteredShiftData = useMemo(() => {
                return shiftData.filter(item => {
                    const matchShift = selectedShift === 'SEMUA' || item.shift === selectedShift;
                    const matchPetugas = !selectedPetugas || 
                        item.supportStaff.toLowerCase().includes(selectedPetugas.toLowerCase()) || 
                        item.adminStaff.toLowerCase().includes(selectedPetugas.toLowerCase());
                    return matchShift && matchPetugas;
                });
            }, [selectedShift, selectedPetugas]);

            const totalPasien = filteredShiftData.length;
            const totalFeeDokter = totalPasien * 20000;
            const totalFeeSupport = totalPasien * 5000;
            const totalFeeAdmin = totalPasien * 1000;

            return (
                <div className="space-y-4 text-xs">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center">
                        <div>
                            <h3 className="font-black text-slate-800 text-sm">Rekapitulasi Fee Berdasarkan Shift & Petugas</h3>
                            <p className="text-slate-500">Hitung otomatis pembagian jasa dokter, penunjang medis, dan admin per shift kerja.</p>
                        </div>
                        <button onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md">
                            <i className="fa-solid fa-print mr-1"></i> Cetak Slip Fee Shift
                        </button>
                    </div>

                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs grid grid-cols-3 gap-4 items-center">
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">Pilih Shift Kerja</label>
                            <select value={selectedShift} onChange={e => setSelectedShift(e.target.value)} className="w-full p-2 border rounded-xl font-bold bg-slate-50">
                                <option value="SEMUA">Semua Shift</option>
                                <option value="Pagi">Shift Pagi</option>
                                <option value="Siang">Shift Siang</option>
                                <option value="Malam">Shift Malam</option>
                            </select>
                        </div>
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">Cari Nama Petugas / Perawat</label>
                            <input 
                                type="text" 
                                placeholder="Ketik nama petugas..." 
                                value={selectedPetugas}
                                onChange={e => setSelectedPetugas(e.target.value)}
                                className="w-full p-2 border rounded-xl font-bold bg-slate-50"
                            />
                        </div>
                        <div className="text-right pt-4">
                            <span className="text-slate-500 font-bold">Total Kunjungan Shift Ini: </span>
                            <span className="text-sky-600 font-black text-sm">{totalPasien} Pasien</span>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 border-b text-slate-600 font-bold uppercase">
                                <tr>
                                    <th className="p-3">Tanggal & Shift</th>
                                    <th className="p-3">Nama Pasien</th>
                                    <th className="p-3">Dokter (Fee Rp 20k)</th>
                                    <th className="p-3">Penunjang Medis (Fee Rp 5k)</th>
                                    <th className="p-3">Admin (Fee Rp 1k)</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredShiftData.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="p-6 text-center text-slate-400 italic">Tidak ada data fee pada shift ini.</td>
                                    </tr>
                                ) : (
                                    filteredShiftData.map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="p-3 font-mono">
                                                <strong className="block text-slate-800">{item.date}</strong>
                                                <span className="text-sky-600 font-bold">Shift: {item.shift}</span>
                                            </td>
                                            <td className="p-3 font-bold">{item.patientName}</td>
                                            <td className="p-3">{item.doctor} <br/><span className="text-emerald-600 font-mono font-bold">Rp 20.000</span></td>
                                            <td className="p-3">{item.supportStaff} <br/><span className="text-indigo-600 font-mono font-bold">Rp 5.000</span></td>
                                            <td className="p-3">{item.adminStaff} <br/><span className="text-amber-600 font-mono font-bold">Rp 1.000</span></td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-sky-50 border border-sky-200 p-4 rounded-2xl text-center">
                            <p className="text-xs font-bold text-sky-800">Akumulasi Fee Dokter</p>
                            <h3 className="text-lg font-black text-sky-900 font-mono mt-1">Rp {totalFeeDokter.toLocaleString('id-ID')}</h3>
                        </div>
                        <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl text-center">
                            <p className="text-xs font-bold text-indigo-800">Akumulasi Penunjang Medis</p>
                            <h3 className="text-lg font-black text-indigo-900 font-mono mt-1">Rp {totalFeeSupport.toLocaleString('id-ID')}</h3>
                        </div>
                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-center">
                            <p className="text-xs font-bold text-amber-800">Akumulasi Fee Admin</p>
                            <h3 className="text-lg font-black text-amber-900 font-mono mt-1">Rp {totalFeeAdmin.toLocaleString('id-ID')}</h3>
                        </div>
                    </div>
                </div>
            );
        }

        function FeeSettingsView() {
            const [feeConfig, setFeeConfig] = useState({
                doctorFee: 20000,
                medicalSupportFee: 5000,
                adminFee: 1000,
                activeOnlyForVisit: true
            });

            const [isSaved, setIsSaved] = useState(false);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFeeConfig({
                    ...feeConfig,
                    [name]: type === 'checkbox' ? checked : Number(value)
                });
            };

            const handleSave = (e) => {
                e.preventDefault();
                setIsSaved(true);
                setTimeout(() => setIsSaved(false), 3000);
            };

            return (
                <div className="space-y-4 text-xs max-w-4xl mx-auto">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center">
                        <div>
                            <h3 className="font-black text-slate-800 text-sm flex items-center gap-2">
                                <i className="fa-solid fa-hand-holding-dollar text-emerald-600 text-base"></i> Pengaturan Fee Jasa Medis & Layanan
                            </h3>
                            <p className="text-slate-500 mt-0.5">Konfigurasi otomatis besaran fee dokter, penunjang medis, dan admin untuk pasien berobat.</p>
                        </div>
                        {isSaved && (
                            <span className="bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 animate-bounce">
                                <i className="fa-solid fa-check"></i> Pengaturan Berhasil Disimpan!
                            </span>
                        )}
                    </div>

                    <form onSubmit={handleSave} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
                        <div className="grid grid-cols-3 gap-4">
                            <div className="p-4 bg-sky-50 border border-sky-200 rounded-2xl space-y-2">
                                <label className="block font-black text-sky-900">
                                    <i className="fa-solid fa-user-doctor mr-1"></i> Fee Dokter / Pasien
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 font-bold">Rp</span>
                                    <input 
                                        type="number" 
                                        name="doctorFee"
                                        value={feeConfig.doctorFee}
                                        onChange={handleChange}
                                        className="w-full pl-9 pr-3 py-2 bg-white border border-sky-300 rounded-xl font-mono font-bold text-slate-900" 
                                        required 
                                    />
                                </div>
                                <p className="text-[10px] text-sky-700">Diberikan per pasien yang datang berobat.</p>
                            </div>

                            <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-2">
                                <label className="block font-black text-indigo-900">
                                    <i className="fa-solid fa-stethoscope mr-1"></i> Fee Penunjang Medis
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 font-bold">Rp</span>
                                    <input 
                                        type="number" 
                                        name="medicalSupportFee"
                                        value={feeConfig.medicalSupportFee}
                                        onChange={handleChange}
                                        className="w-full pl-9 pr-3 py-2 bg-white border border-indigo-300 rounded-xl font-mono font-bold text-slate-900" 
                                        required 
                                    />
                                </div>
                                <p className="text-[10px] text-indigo-700">Alokasi untuk petugas penunjang medis / perawat.</p>
                            </div>

                            <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl space-y-2">
                                <label className="block font-black text-amber-900">
                                    <i className="fa-solid fa-file-invoice mr-1"></i> Fee Admin / Pasien
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 font-bold">Rp</span>
                                    <input 
                                        type="number" 
                                        name="adminFee"
                                        value={feeConfig.adminFee}
                                        onChange={handleChange}
                                        className="w-full pl-9 pr-3 py-2 bg-white border border-amber-300 rounded-xl font-mono font-bold text-slate-900" 
                                        required 
                                    />
                                </div>
                                <p className="text-[10px] text-amber-700">Biaya administrasi pendaftaran klinik.</p>
                            </div>
                        </div>

                        <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                            <h4 className="font-black text-slate-800 uppercase tracking-wider text-[11px]">Ketentuan & Aturan Pemberlakuan Fee</h4>
                            <label className="flex items-center gap-2.5 cursor-pointer">
                                <input 
                                    type="checkbox" 
                                    name="activeOnlyForVisit"
                                    checked={feeConfig.activeOnlyForVisit}
                                    onChange={handleChange}
                                    className="w-4 h-4 text-sky-600 rounded border-slate-300 focus:ring-sky-500"
                                />
                                <span className="font-bold text-slate-700">
                                    Hanya berlakukan fee/jasa ini khusus untuk pasien yang datang berobat (Praktik Dokter), tidak berlaku untuk pembelian produk bebas di apotek.
                                </span>
                            </label>
                        </div>

                        <div className="pt-2 flex justify-end">
                            <button type="submit" className="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-black rounded-xl uppercase tracking-wider shadow-md transition">
                                <i className="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Pengaturan Fee
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
